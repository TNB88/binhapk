<script>
        // ============================================================
        // 🔴 CẤU HÌNH QUẢN TRỊ VIÊN (SỬA Ở ĐÂY)
        // ============================================================
        
        // 1. Mật khẩu để vào trang web
        const MAT_KHAU_DUNG = "123456"; 

        // 2. Phiên bản khóa (QUAN TRỌNG)
        // Khi bạn đổi mật khẩu, hãy đổi luôn chữ này (ví dụ: "v1" -> "v2")
        // Làm vậy thì TẤT CẢ người dùng cũ sẽ bị đăng xuất và bắt nhập lại pass mới.
        const PHIEN_BAN_KHOA = "v1"; 

        // ============================================================

        // --- KIỂM TRA PHIÊN BẢN & TRẠNG THÁI ĐĂNG NHẬP ---
        function checkLoginStatus() {
            const userVersion = localStorage.getItem("khoaVersion");
            const isVip = localStorage.getItem("vipUser");

            // Nếu phiên bản cũ không khớp với phiên bản mới -> XÓA ĐĂNG NHẬP CŨ
            if (userVersion !== PHIEN_BAN_KHOA) {
                localStorage.removeItem("vipUser");
                localStorage.removeItem("khoaVersion");
                return false; // Chưa đăng nhập (do vừa bị reset)
            }

            // Nếu đúng phiên bản và đã đăng nhập
            if (isVip === "true") {
                return true;
            }
            
            return false;
        }

        // Ẩn/Hiện màn hình khóa dựa trên trạng thái
        if (checkLoginStatus() === true) {
            document.getElementById("loginOverlay").style.display = "none";
        } else {
            document.getElementById("loginOverlay").style.display = "flex";
        }

        // --- HÀM XỬ LÝ KHI BẤM NÚT MỞ KHÓA ---
        function checkPass() {
            var input = document.getElementById("passInput").value;
            var box = document.getElementById("loginBox");
            var msg = document.getElementById("errorMsg");
            
            if(input === MAT_KHAU_DUNG) {
                // Đăng nhập thành công
                document.getElementById("loginOverlay").style.display = "none";
                
                // Lưu trạng thái VÀ lưu phiên bản hiện tại
                localStorage.setItem("vipUser", "true"); 
                localStorage.setItem("khoaVersion", PHIEN_BAN_KHOA); 
            } else {
                msg.style.display = "block";
                // Hiệu ứng rung lắc
                box.style.transform = "translateX(10px)";
                setTimeout(() => box.style.transform = "translateX(-10px)", 100);
                setTimeout(() => box.style.transform = "translateX(0)", 200);
            }
        }
        
        document.getElementById("passInput").addEventListener("keypress", function(e){
            if(e.key === "Enter") checkPass();
        });

        // === CÁC TÍNH NĂNG KHÁC (Dark Mode, Lọc, Toast...) GIỮ NGUYÊN ===

        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            if(document.body.classList.contains("dark-mode")) {
                localStorage.setItem("theme", "dark");
            } else {
                localStorage.setItem("theme", "light");
            }
        }
        if(localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
        }

        function filterApps() {
            var input = document.getElementById('searchInput');
            var filter = input.value.toUpperCase();
            var cards = document.getElementsByClassName('app-card');
            resetButtons(); 

            for (var i = 0; i < cards.length; i++) {
                var h3 = cards[i].getElementsByTagName("h3")[0];
                var txtValue = h3.textContent || h3.innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        function filterCategory(category, btnElement) {
            document.getElementById('searchInput').value = "";
            var btns = document.getElementsByClassName("filter-btn");
            for(var b of btns) b.classList.remove("active");
            btnElement.classList.add("active");

            var cards = document.getElementsByClassName('app-card');
            for (var i = 0; i < cards.length; i++) {
                var cat = cards[i].getAttribute("data-category");
                if (category === 'all' || cat === category) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
        
        function resetButtons(){
             var btns = document.getElementsByClassName("filter-btn");
             for(var b of btns) b.classList.remove("active");
             btns[0].classList.add("active"); 
        }

        // Giả lập số liệu
        let baseDownloads = 15402; 
        let localClicks = parseInt(localStorage.getItem("myClicks")) || 0;
        
        function updateDownloadDisplay() {
            let total = baseDownloads + localClicks;
            document.getElementById("downloadCount").innerText = total.toLocaleString('en-US');
        }

        function startDownload(element) {
            localClicks++;
            localStorage.setItem("myClicks", localClicks);
            updateDownloadDisplay();

            var appName = element.getElementsByTagName("h3")[0].innerText;
            var toast = document.getElementById("toast");
            toast.innerText = "✅ Đang bắt đầu tải: " + appName;
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function updateOnlineUsers() {
            let users = Math.floor(Math.random() * (60 - 25 + 1)) + 25; 
            document.getElementById("onlineCount").innerText = users;
        }

        updateDownloadDisplay();
        updateOnlineUsers();
        setInterval(updateOnlineUsers, 4000);

    </script>
