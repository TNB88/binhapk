<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHO TẢI BÌNH PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- 1. CẤU HÌNH MÀU SẮC (LIGHT THEME) --- */
        :root {
            --bg-body: #f3f4f6;        
            --bg-card: #ffffff;        
            --primary: #2563eb;       
            --text-main: #1f2937;     
            --text-sub: #6b7280;      
            --border-color: #e5e7eb;
            --header-bg: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
            --shadow-soft: 0 10px 40px -10px rgba(0,0,0,0.08); 
            --shadow-hover: 0 20px 50px -10px rgba(37, 99, 235, 0.2);
        }

        /* --- DARK MODE VARIABLES --- */
        .dark-mode {
            --bg-body: #111827;        
            --bg-card: #1f2937;        
            --text-main: #f9fafb;      
            --text-sub: #9ca3af;       
            --border-color: #374151;
            --header-bg: #1f2937;      
            --shadow-soft: 0 10px 40px -10px rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0; padding: 0;
            min-height: 100vh;
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- 2. HEADER --- */
        .header {
            background: var(--header-bg);
            padding: 15px 20px; 
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: background 0.3s;
        }

        .header-top { position: relative; }

        .theme-toggle {
            position: absolute; top: 0; right: 0;
            background: rgba(0,0,0,0.05); border: none;
            padding: 8px 12px; border-radius: 20px;
            cursor: pointer; font-size: 16px;
            transition: all 0.2s;
        }
        .dark-mode .theme-toggle { background: rgba(255,255,255,0.1); color: yellow; }
        .theme-toggle:hover { transform: scale(1.1); }

        .header h1 {
            margin: 0;
            font-size: 26px; 
            font-weight: 800;
            background: linear-gradient(to right, #2563eb, #9333ea); 
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .sub-title {
            margin-top: 2px; color: var(--text-sub); font-size: 13px;
        }

        .stats-bar {
            display: flex; justify-content: center; gap: 15px;
            margin-top: 8px; font-size: 12px;
            color: var(--text-sub); font-weight: 600;
        }
        .stat-item {
            display: flex; align-items: center; gap: 5px;
            background: rgba(37, 99, 235, 0.1);
            padding: 4px 10px; border-radius: 20px;
        }
        .dark-mode .stat-item { background: rgba(37, 99, 235, 0.2); }
        .stat-dot {
            height: 8px; width: 8px; background-color: #22c55e;
            border-radius: 50%; display: inline-block;
            box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
        .stat-number { color: var(--primary); font-weight: 800; }

        .search-container {
            margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }

        .search-box {
            width: 100%; max-width: 500px; 
            padding: 8px 20px; border-radius: 100px; 
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main); font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            transition: all 0.3s ease; outline: none;
        }
        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); 
        }

        /* --- BỘ LỌC NHANH --- */
        .filter-buttons {
            display: flex; gap: 8px; overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none; 
        }
        .filter-btn {
            background: var(--bg-card); border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 6px 16px; border-radius: 20px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            white-space: nowrap; transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--primary); color: white; border-color: var(--primary);
        }

        /* --- 3. LƯỚI ỨNG DỤNG --- */

            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
